name: Deploy

on:
  push:
    branches: [development, staging, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options: [dev, stg, prd]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: cdk deploy (dev)
        run: npx cdk deploy --require-approval never --context env=dev --context dev-test-user-password='${{ secrets.DEV_TEST_USER_PASSWORD }}' --context supabase-project-ref='${{ vars.SUPABASE_PROJECT_REF }}'
        env:
          RAG_ENV: dev

  deploy-stg:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: cdk deploy (stg)
        run: npx cdk deploy --require-approval never --context env=stg --context supabase-project-ref='${{ vars.SUPABASE_PROJECT_REF }}'
        env:
          RAG_ENV: stg

  deploy-prd:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: cdk deploy (prd)
        run: npx cdk deploy --require-approval never --context env=prd --context supabase-project-ref='${{ vars.SUPABASE_PROJECT_REF }}'
        env:
          RAG_ENV: prd

